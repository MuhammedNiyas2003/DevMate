spring:
  application:
    name: backend-java

  datasource:
    url: jdbc:postgresql://localhost:5432/devmate
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: mySuperSecretKeyForDevMateJwtTokenGeneration123456789
  expiration: 86400000